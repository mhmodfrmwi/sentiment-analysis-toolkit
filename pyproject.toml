[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-analysis-toolkit"
version = "1.0.0"
description = "End-to-end sentiment analysis toolkit with API, web UI, and fine-tuning notebook."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mahmoud" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "transformers>=4.40",
  "torch>=2.1",
  "matplotlib>=3.8",
  "wordcloud>=1.9",
  "streamlit>=1.32",
  "pandas>=2.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]
train = [
  "datasets>=2.18",
  "evaluate>=0.4",
  "scikit-learn>=1.4",
  "accelerate>=0.28",
]

[project.scripts]
sentiment-toolkit = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
